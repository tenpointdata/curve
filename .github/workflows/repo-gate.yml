name: repo-gate

# The repo gate (gates/repo.ts: the allow list and the ttok caps) on every PR,
# and again in the merge queue, on main plus the PRs queued ahead plus this
# one. Use main's gate against the proposed tree once main has the Curve layout.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: repo-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: pipx install ttok==0.3
      - name: main's gate files over this tree
        run: |
          git fetch --no-tags --depth=1 origin main
          if git cat-file -e FETCH_HEAD:curve2/curve.ts; then
            git archive FETCH_HEAD gates/repo.ts gates/_lib.ts | tar -xf -
          fi
      - run: bun gates/repo.ts
      - run: bun curve2/main.ts optimization/gate.curve --check-only
      - run: bun test --preload ./curve2/main.ts optimization/optimization.test.ts
      - name: Verify source installation
        run: |
          sh scripts/build.sh "$RUNNER_TEMP/curve-install"
          "$RUNNER_TEMP/curve-install/bin/curve" --version
          "$RUNNER_TEMP/curve-install/bin/curve" optimize --help
